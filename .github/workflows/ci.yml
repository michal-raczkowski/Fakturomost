# Location in repo: .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# A new push to the same branch/PR cancels the outdated run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false          # let Windows finish even if Linux fails, and vice versa
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash             # Git Bash on Windows, so ./mvnw works on both runners

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven          # caches ~/.m2/repository keyed on pom.xml files

      - name: Build and test
        # -B: batch mode (no interactive output), -ntp: no download progress noise
        run: ./mvnw -B -ntp verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.os }}
          path: '**/target/surefire-reports/'
          retention-days: 7
