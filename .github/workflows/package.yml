# Builds portable desktop apps with a bundled Java runtime (jpackage), one per OS:
#   Fakturomost-<version>-windows-x64.zip   and   Fakturomost-<version>-linux-x64.tar.gz
#
# Run it by hand (Actions → Package → Run workflow) and download the files from the run's
# "Artifacts" section, or push a tag like v0.1.0 to also publish them as a GitHub pre-release.
# jpackage can only build for the OS it runs on, hence the matrix.
name: Package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Same tests as CI, so a package is never built from a red tree.
      - name: Build and test
        run: ./mvnw -B -ntp -pl fakturomost-desktop -am verify

      - name: Package with jpackage
        shell: bash
        run: bash packaging/package.sh

      # archive: false uploads the .zip / .tar.gz as it is (no zip around it, Linux permissions kept).
      - name: Upload ${{ matrix.platform }}
        uses: actions/upload-artifact@v7
        with:
          path: fakturomost-desktop/target/dist/Fakturomost-*-${{ matrix.platform }}.*
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    name: Pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Fakturomost $GITHUB_REF_NAME (experimental)" \
            --notes "Experimental test build — synthetic demo data or KSeF test-environment invoices only; imported invoices are kept in memory. Windows: unzip and run Fakturomost.exe (unsigned: SmartScreen → More info → Run anyway). Linux: extract and run Fakturomost/bin/Fakturomost. Java is included. See README.txt inside the archive."
